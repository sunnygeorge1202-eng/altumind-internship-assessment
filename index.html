<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altumind Internship Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --ink:#1D211D;
    --slate:#565F58;
    --sage:#5E7C5A;
    --sage-dark:#456142;
    --line:#DEDBD0;
    --amber:#A8763A;
    --red:#A34A3C;
    --card:#FFFFFF;
    --marigold:#DFA51E;
    --teal:#1F6F63;
    --clay:#B85C38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    margin:0 0 0.4em 0;
    color:var(--ink);
  }
  .screen{
    max-width:640px;
    margin:0 auto;
    padding:48px 24px 80px;
    min-height:100vh;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px;
    overflow-wrap:break-word;
  }
  .eyebrow{
    color:var(--sage-dark);
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    margin-bottom:10px;
    overflow-wrap:break-word;
    white-space:normal;
  }
  .required-mark{color:var(--red);margin-left:2px;}
  p{margin:0 0 1em 0;color:var(--slate);}
  .lede{font-size:16px;color:var(--slate);}
  label{display:block;font-weight:500;font-size:14px;margin-bottom:6px;color:var(--ink);}
  input[type=text], input[type=email], textarea, select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:18px;
  }
  textarea{min-height:140px;resize:vertical;line-height:1.5;}
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
    border-color:var(--sage);
  }
  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .checkbox-row:hover{border-color:var(--sage);}
  .checkbox-row input{width:auto;flex-shrink:0;margin:2px 0 0 0;}
  .checkbox-row > span{flex:1;min-width:0;}
  .checkbox-row .role-label{font-size:15px;color:var(--ink);overflow-wrap:break-word;word-break:break-word;}
  .checkbox-row .role-track{font-size:12px;color:var(--slate);overflow-wrap:break-word;word-break:break-word;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 22px;
    border-radius:4px;
    border:none;
    cursor:pointer;
    transition:opacity 0.15s;
  }
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button:hover:not(:disabled){opacity:0.88;}
  .btn-primary{background:var(--sage-dark);color:#fff;}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-row{display:flex;gap:12px;margin-top:24px;}
  .btn-row.right{justify-content:flex-end;}

  /* header bar during assessment */
  .topbar{
    position:sticky;top:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:8px 16px;
    align-items:center;
    justify-content:space-between;
    z-index:10;
  }
  .topbar .brand{
    font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .timer{
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:600;
    padding:5px 12px;
    border-radius:4px;
    background:var(--card);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .timer.low{color:var(--red);border-color:var(--red);}

  /* question map */
  .qmap-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(46px,1fr));
    gap:8px;
    margin:20px 0 8px;
  }
  .qmap-dot{
    height:46px;
    border-radius:4px;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;
    cursor:pointer;
    background:var(--card);color:var(--slate);
  }
  .qmap-dot.submitted{background:var(--sage);border-color:var(--sage);color:#fff;cursor:default;}
  .qmap-dot.progress{background:#F4E9D8;border-color:var(--amber);color:var(--amber);}
  .qmap-legend{display:flex;gap:18px;font-size:13px;color:var(--slate);margin-bottom:6px;}
  .qmap-legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot-swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* question screen */
  .qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .qtag{font-size:12px;font-weight:600;color:var(--sage-dark);letter-spacing:0.01em;flex:1;min-width:0;overflow-wrap:break-word;}
  .qtimer{font-size:12px;color:var(--slate);font-variant-numeric:tabular-nums;flex-shrink:0;white-space:nowrap;}
  .prompt{font-size:17px;line-height:1.6;margin:14px 0 22px;color:var(--ink);user-select:none;-webkit-user-select:none;overflow-wrap:break-word;word-break:break-word;}
  .question-content{transition:filter 0.35s ease;}
  .question-content.idle-blurred{filter:blur(8px);pointer-events:none;}

  video, .video-preview{width:100%;border-radius:4px;background:#111;margin-bottom:14px;}
  .rec-status{font-size:13px;color:var(--red);font-weight:600;margin-bottom:10px;display:none;}
  .rec-status.active{display:block;}
  .rec-controls{display:flex;gap:10px;margin-bottom:16px;}

  .hint{font-size:13px;color:var(--slate);margin-top:10px;margin-bottom:16px;}
  .locked-note{
    background:#F0F3EE;border:1px solid var(--sage);color:var(--sage-dark);
    padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:16px;
  }
  .warn-note{
    background:#FBEFE0;border:1px solid var(--amber);color:#7A5518;
    padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:16px;display:none;
  }
  .final-note{text-align:center;padding:60px 0;}
  a.plain{color:var(--sage-dark);}

  /* ---- landing hero (candidate-facing, warmer than the test screens) ---- */
  .hero{
    background:linear-gradient(155deg, #FCF6E8 0%, var(--paper) 55%);
    border-bottom:1px solid var(--line);
    padding:56px 24px 40px;
  }
  .hero-inner{max-width:640px;margin:0 auto;}
  .hero-mark{
    font-family:'Source Serif 4',serif;font-weight:700;font-size:14px;
    letter-spacing:0.03em;color:var(--teal);margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(26px, 6vw, 38px);line-height:1.18;margin-bottom:14px;
    opacity:0;animation:heroIn 0.7s ease-out 0.1s forwards;
    overflow-wrap:break-word;
  }
  .hero .sub{
    font-size:17px;color:var(--slate);max-width:480px;margin-bottom:22px;
    opacity:0;animation:heroIn 0.7s ease-out 0.25s forwards;
  }
  .pills{display:flex;gap:10px;flex-wrap:wrap;opacity:0;animation:heroIn 0.7s ease-out 0.4s forwards;}
  .pill{
    font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;
    display:inline-flex;align-items:center;gap:7px;background:var(--card);
    border:1px solid var(--line);color:var(--ink);
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  @keyframes heroIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .hero h1, .hero .sub, .pills{animation:none;opacity:1;}
  }
  @media (max-width:480px){
    .screen{padding:32px 16px 60px;}
    .form-wrap{padding:24px 16px 60px;}
    .hero{padding:40px 16px 28px;}
    .card{padding:22px;}
    .topbar{padding:12px 16px;}
    .btn-row{flex-wrap:wrap;}
  }
  .form-wrap{max-width:640px;margin:0 auto;padding:32px 24px 80px;}
</style>
</head>

const QUANT_ITEMS = [
  // --- Objective (MCQ) — fast, auto-graded, hard to usefully outsource one at a time ---
  {id:"QM1", type:"mcq", tag:"Arithmetic", prompt:"A client gets a 15% discount on a ₹4,80,000 annual license, committing for 3 years paid upfront. What is the effective annual cost?", options:["₹3,88,000","₹4,08,000","₹4,20,000","₹4,32,000"], correctIndex:2},
  {id:"QM2", type:"mcq", tag:"Pattern recognition", prompt:"A defaulter list shrinks by half every week (240 in week 1). In which week does it first drop below 10?", options:["Week 4","Week 5","Week 6","Week 7"], correctIndex:2},
  {id:"QM3", type:"mcq", tag:"Data reading", prompt:"Hospital A's admin-hours-saved over 3 months: 40, 65, 72. Hospital D's: 10, 40, 85. Which is the more credible steady improvement trend (least likely to be a one-off spike)?", options:["Hospital A","Hospital D","Both equally credible","Neither shows a trend"], correctIndex:0},
  {id:"QM4", type:"mcq", tag:"Probability", prompt:"A funnel converts leads to demos at 30%, and demos to paid pilots at 25%. Out of 200 leads, roughly how many become paid pilots?", options:["10","15","20","30"], correctIndex:1},
  {id:"QM5", type:"mcq", tag:"Ratio & proportion", prompt:"A pilot budget of ₹10,00,000 is split across 3 segments in a 5:3:2 ratio. What's the allocation to the middle-weighted segment?", options:["₹2,00,000","₹3,00,000","₹5,00,000","₹3,50,000"], correctIndex:1},
  {id:"QM6", type:"mcq", tag:"Logical deduction", prompt:"A feature ships only when both 'tested' and 'approved' are true. If a feature is not shipped, which must be true?", options:["It is definitely not tested","It is definitely not approved","At least one of tested/approved is false","Both tested and approved are false"], correctIndex:2},
  {id:"QM7", type:"mcq", tag:"Order-of-magnitude estimation", prompt:"Roughly how many schools (all boards combined) are there in the state of Karnataka?", options:["~2,000","~15,000","~55,000","~2,00,000"], correctIndex:2},

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ":" + String(s).padStart(2,"0");
}

function buildSession1Questions(){
  return [
    ...QUANT_ITEMS.map(q=>({...q, section:"Quantitative Ability"})),
    ...COMM_ITEMS.map(q=>({...q, section:"Communication"}))
  ];
}

function buildSession2Questions(roleIds){
  const qs = [];
  roleIds.forEach(roleId=>{
    const roleLabel = ROLE_LABELS[roleId] || roleId;
    Object.entries(BEHAVIORAL_MATRIX).forEach(([key, comp])=>{
      qs.push({
        id: roleId + "_" + key,
        tag: comp.label + " — " + roleLabel,
        video:false,
        prompt: comp[roleId],
        section:"Behavioral — " + roleLabel
      });
    });
  });
  return qs;
}

function sendToBackend(payload){
  if(ENDPOINT_URL.indexOf("REPLACE_WITH") === 0){
    console.warn("Endpoint not configured — payload not sent:", payload.type, payload.questionId||"");
    return;
  }
  fetch(ENDPOINT_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain"}, // avoids CORS preflight on Apps Script
    body: JSON.stringify(payload)
  }).catch(err=>console.warn("Save failed, will retry on final submit", err));
}

// Authoritative one-attempt-per-session check against the backend. Returns true if this
// candidate has already started (or completed) this session, per the Sessions sheet.
async function checkAttemptUsed(email, session){
  if(ENDPOINT_URL.indexOf("REPLACE_WITH") === 0) return false; // can't check before backend is configured
  try{
    const url = ENDPOINT_URL + "?action=check_attempt&email=" + encodeURIComponent(email) + "&session=" + encodeURIComponent(session);
    const res = await fetch(url);
    const data = await res.json();
    return !!(data && data.alreadyUsed);
  }catch(err){
    console.warn("Attempt check failed, allowing candidate through:", err);
    return false; // fail open rather than blocking a legitimate candidate on a network hiccup
  }
}

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* ============================================================
   LOCATION — GPS with IP fallback. Consent is required before this runs.
   ============================================================ */
async function captureLocation(){
  const gpsResult = await tryGPS();
  if(gpsResult){ state.location = gpsResult; return; }
  const ipResult = await tryIPLookup();
  state.location = ipResult || {lat:null, lng:null, source:"unavailable"};
}

function tryGPS(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const timer = setTimeout(()=>resolve(null), 6000);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        clearTimeout(timer);
        resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, source:"gps", accuracyM:pos.coords.accuracy});
      },
      ()=>{ clearTimeout(timer); resolve(null); },
      {timeout:5500, maximumAge:60000}
    );
  });
}

async function tryIPLookup(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    if(!res.ok) return null;
    const d = await res.json();
    return {lat:d.latitude, lng:d.longitude, source:"ip", city:d.city, region:d.region};
  }catch(err){
    return null;
  }
}

/* ============================================================
   HEARTBEAT — periodic ping while a timed session is active, so the
   admin live-map shows who is currently logged in and roughly where.
   ============================================================ */
function startHeartbeat(){
  if(state.heartbeatHandle) clearInterval(state.heartbeatHandle);
  const ping = ()=>{
    sendToBackend({
      type:"heartbeat",
      session:state.session,
      candidate:state.candidate,
      location:state.location,
      currentQuestionId:state.currentQid,
      timestamp:new Date().toISOString()
    });
  };
  ping();
  state.heartbeatHandle = setInterval(ping, 20000);
}

function stopHeartbeat(){
  if(state.heartbeatHandle) clearInterval(state.heartbeatHandle);
  state.heartbeatHandle = null;
}

/* ============================================================
   INTEGRITY MONITORING — copy/paste disabled, tab/window-switch ends
   the session. Best-effort: browser APIs can detect a tab switch or a
   new tab/window in the same browser reliably, but cannot detect e.g.
   a second physical monitor being viewed.
   ============================================================ */
function attachIntegrityListeners(){
  if(state.listenersAttached) return;
  state.listenersAttached = true;
  document.addEventListener("visibilitychange", onVisibilityChange);
  // Note: we deliberately do NOT listen for window "blur". Native alert()
  // dialogs, the address bar, devtools, and OS notifications all fire blur
  // without the candidate ever leaving the tab, so it produces false
  // positives (this caused a real bug: a validation alert() was triggering
  // an auto-submit). "visibilitychange" only fires when the tab itself is
  // actually hidden (switched away from, minimized, or another window is
  // brought fully to the foreground), which matches what we actually want
  // to detect.
}

function onVisibilityChange(){
  if(document.hidden && state.sessionActive && state.screen!=="done"){
    triggerIntegrityViolation("tab_hidden");
  }
}

function triggerIntegrityViolation(reason){
  if(state.integrityTriggered) return;
  state.integrityTriggered = true;
  autoSubmitAllAndEnd(reason);
}

/* Non-blocking validation messages. We deliberately avoid native alert() during
   a live session: it freezes JS execution (silently pausing the visible countdown
   for however long it's open) and, in some browsers, fires a window "blur" event
   that could be mistaken for the candidate leaving the tab. This writes directly
   into the DOM rather than calling render(), so in-progress form state (typed
   text, checked boxes, selected radios) is never lost. */
function showInlineWarning(msg){
  let el = document.getElementById("inlineWarning");
  if(!el){
    el = document.createElement("div");
    el.id = "inlineWarning";
    el.className = "warn-note";
    const btnRow = document.querySelector(".btn-row");
    if(btnRow && btnRow.parentNode){ btnRow.parentNode.insertBefore(el, btnRow); }
    else { document.querySelector(".card, .screen").appendChild(el); }
  }
  el.textContent = msg;
  el.style.display = "block";
}

// Block copy / cut / paste / right-click everywhere, for the life of the page.
["copy","cut","paste","contextmenu"].forEach(evt=>{
  document.addEventListener(evt, e=>{ e.preventDefault(); return false; });
});

/* ============================================================
   IDLE BLUR — the question text blurs if the page looks idle (no mouse
   movement, clicks, taps, scrolling, or typing), and sharpens the moment
   activity resumes. This is a deterrent against someone stepping away to
   photograph the screen with a second device, not a real defense: it
   won't stop a candidate who keeps the mouse moving with one hand while
   photographing with the other, and it will also blur during genuine
   silent thinking (which is common right before writing a longer answer).
   Tune IDLE_BLUR_MS below if it's triggering too eagerly or too slowly.
   Video-response questions are exempt — candidates need to read the
   prompt steadily while recording, without it blurring on them.
   ============================================================ */
const IDLE_BLUR_MS = 5000;
let idleBlurTimer = null;

function armIdleBlur(){
  if(idleBlurTimer) clearTimeout(idleBlurTimer);
  const el = document.getElementById("questionContent");
  if(el) el.classList.remove("idle-blurred");
  if(state.screen!=="question") return;
  idleBlurTimer = setTimeout(()=>{
    if(state.screen==="question"){
      const el2 = document.getElementById("questionContent");
      if(el2) el2.classList.add("idle-blurred");
    }
  }, IDLE_BLUR_MS);
}

["mousemove","mousedown","touchstart","touchmove","pointermove","scroll","keydown"].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(state.screen==="question") armIdleBlur(); }, {passive:true});
});

  else if(state.screen==="done") app.innerHTML = renderDone();
  bindEvents();
}

    <div class="qmap-legend">
      <span><span class="dot-swatch" style="background:var(--card);border:1px solid var(--line)"></span> Not started</span>
      <span><span class="dot-swatch" style="background:#F4E9D8;border:1px solid var(--amber)"></span> In progress</span>
      <span><span class="dot-swatch" style="background:var(--sage)"></span> Submitted</span>
    </div>
    <div class="qmap-grid">${dots}</div>
    <div class="btn-row">
      <button class="btn-primary" id="btnFinish" ${allSubmitted? "" : "disabled"}>Finish session</button>
    </div>
    ${allSubmitted? "" : `<p class="hint">Finish becomes available once every question is submitted.</p>`}
  </div>`;
}

/* ---------- QUESTION ---------- */
function renderQuestion(){
  const q = state.questions.find(x=>x.id===state.currentQid);
  const a = state.answers[q.id] || {text:"", timeSpent:0, submitted:false};
  const idx = state.questions.findIndex(x=>x.id===q.id) + 1;

  let questionContentHtml, bodyHtml, idleHint = "";
  if(q.type==="mcq"){
    const optRows = q.options.map((opt,i)=>`
      <label class="checkbox-row">
        <input type="radio" name="mcqOption" value="${i}" ${a.selectedOption===i?"checked":""}>
        <span class="role-label">${opt}</span>
      </label>`).join("");
    questionContentHtml = `<div class="question-content" id="questionContent"><div class="prompt">${q.prompt}</div><div id="mcqOptions">${optRows}</div></div>`;
    bodyHtml = "";
    idleHint = `<p class="hint" style="margin-top:-10px;">The question blurs if this page looks idle — keep interacting with it (mouse or keyboard) while you work.</p>`;
  } else if(q.video){
    questionContentHtml = `<div class="prompt">${q.prompt}</div>`; // video items are exempt — see note below
    bodyHtml = `
      <video id="preview" autoplay muted playsinline></video>
      <div class="rec-status" id="recStatus">Recording — <span id="recTimer">0</span>s / 90s</div>
      <div class="rec-controls">
        <button class="btn-secondary" id="btnRecord" type="button">Start recording</button>
        <button class="btn-secondary" id="btnStop" type="button" disabled>Stop</button>
      </div>
      ${a.videoBlobUrl ? `<p class="hint">Recorded response ready. Recording again will replace it.</p><video src="${a.videoBlobUrl}" controls class="video-preview"></video>` : ""}
    `;
  } else {
    questionContentHtml = `<div class="question-content" id="questionContent"><div class="prompt">${q.prompt}</div></div>`;
    bodyHtml = `<textarea id="answerText" placeholder="Type your response here...">${a.text||""}</textarea>`;
    idleHint = `<p class="hint" style="margin-top:-10px;">The question blurs if this page looks idle — keep interacting with it (mouse or keyboard) while you work.</p>`;
  }

  return `
  <div class="topbar">
    <div class="brand">Altumind Assessment</div>
    <div class="timer ${state.globalTimeLeft<300?'low':''}" id="globalTimerDisplay">${fmtTime(state.globalTimeLeft)}</div>
  </div>
  <div class="screen">
    <div class="qmeta">
      <div class="qtag">${q.section} · Question ${idx} of ${state.questions.length}</div>
      <div class="qtimer">Time on this question: <span id="qTimerDisplay">${fmtTime(a.timeSpent||0)}</span></div>
    </div>
    ${questionContentHtml}
    ${idleHint}
    ${bodyHtml}
    <div class="btn-row">
      <button class="btn-secondary" id="btnReview">Review (save &amp; switch question)</button>
      <button class="btn-primary" id="btnSubmitQ">Submit answer</button>
    </div>
  </div>`;
}

/* ---------- DONE ---------- */
function renderDone(){
  const sessionLabel = state.session==="session1" ? "Session 1 — Quantitative Ability & Communication" : "Session 2 — Behavioral Competencies";
  const otherSession = state.session==="session1" ? "Session 2 — Behavioral Competencies" : "Session 1 — Quantitative Ability & Communication";
  let heading = sessionLabel + ": complete";
  let message = "Your responses for this session have been recorded. You can close this window now.";
  if(state.doneReason==="tab_hidden" || state.doneReason==="window_blur"){
    heading = sessionLabel + ": ended";
    message = "This session was ended automatically because another browser tab or window was opened, or you navigated away from this tab. Your answers were submitted as they stood at that moment.";
  } else if(state.doneReason==="time_limit"){
    heading = sessionLabel + ": time's up";
    message = "The session timer reached zero, so your remaining answers were submitted automatically as they stood.";
  }
  return `
  <div class="screen">
    <div class="final-note">
      <h1>${heading}</h1>
      <p>${message}</p>
      <p class="hint">Have ${otherSession} left to complete? <a class="plain" href="${window.location.origin}${window.location.pathname}">Reopen this link</a> to start it.</p>
    </div>
  </div>`;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindEvents(){
  const $ = id => document.getElementById(id);

  if(state.screen==="landing"){
    $("btnStart").onclick = async ()=>{
      const name = $("fname").value.trim();
      const email = $("femail").value.trim();
      const session = $("fsession").value;
      const errEl = $("landingError");
      errEl.style.display = "none";
      if(!name || !email || !session){ showInlineWarning("Please fill in your name, email, and select a session."); return; }
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(!EMAIL_RE.test(email)){ showInlineWarning("Please enter a valid email address (e.g. name@example.com)."); return; }

      const localKey = "altumind_attempt_" + session + "_" + email.toLowerCase();
      if(localStorage.getItem(localKey)){
        errEl.textContent = "You've already used your attempt for this session on this device. If you believe this is an error, contact Altumind.";
        errEl.style.display = "block";
        return;
      }

      $("btnStart").disabled = true;
      $("btnStart").textContent = "Checking...";
      const already = await checkAttemptUsed(email, session);
      $("btnStart").disabled = false;
      $("btnStart").textContent = "Continue";

      if(already){
        localStorage.setItem(localKey, "1");
        errEl.textContent = "This session has already been started or completed for this email. Each session can only be attempted once. If you believe this is an error, contact Altumind.";
        errEl.style.display = "block";
        return;
      }

      state.candidate = {name, email};
      state.session = session;
      if(session==="session2"){
        state.screen = "roles";
      } else {
        state.questions = buildSession1Questions();
        state.screen = "instructions";
      }
      render();
    };
  }

  if(state.screen==="roles"){
    $("btnBack").onclick = ()=>{ state.screen="landing"; render(); };
    $("btnRolesNext").onclick = ()=>{
      const checked = Array.from(document.querySelectorAll('.checkbox-row input:checked')).map(el=>el.value);
      if(checked.length===0){ showInlineWarning("Select at least one role."); return; }
      state.selectedRoles = checked;
      state.questions = buildSession2Questions(checked);
      state.screen = "instructions";
      render();
    };
  }

  if(state.screen==="instructions"){
    $("btnBack").onclick = ()=>{
      state.screen = state.session==="session2" ? "roles" : "landing";
      render();
    };
    $("btnBeginSession").onclick = async ()=>{
      const consent = $("consentCheck");
      if(!consent || !consent.checked){ showInlineWarning("Please check the consent box to continue."); return; }
      $("btnBeginSession").disabled = true;
      $("btnBeginSession").textContent = "Starting...";
      await captureLocation();
      localStorage.setItem("altumind_attempt_" + state.session + "_" + state.candidate.email.toLowerCase(), "1");
      state.globalTimeLeft = SESSION_TIME_LIMITS[state.session];
      startGlobalTimer();
      state.sessionActive = true;
      state.integrityTriggered = false;
      attachIntegrityListeners();
      startHeartbeat();
      sendToBackend({
        type:"session_start", session:state.session, candidate:state.candidate,
        roles:state.selectedRoles, questionIds:state.questions.map(q=>q.id),
        location: state.location,
        timestamp:new Date().toISOString()
      });
      state.screen = "map";
      render();
    };
  }

  if(state.screen==="map"){
    document.querySelectorAll(".qmap-dot").forEach(dot=>{
      dot.onclick = ()=>{
        const qid = dot.dataset.qid;
        const a = state.answers[qid];
        if(a && a.submitted) return;
        openQuestion(qid);
      };
    });
    const finishBtn = $("btnFinish");
    if(finishBtn && !finishBtn.disabled){
      finishBtn.onclick = finishSession;
    }
  }

  if(state.screen==="question"){
    const q = state.questions.find(x=>x.id===state.currentQid);
    armIdleBlur();

    $("btnReview").onclick = ()=>{ pauseQuestionTimer(saveDraftAndGoToMap); };
    $("btnSubmitQ").onclick = ()=>{ submitCurrentQuestion(); };

    if(q.video){
      $("btnRecord").onclick = startRecording;
      $("btnStop").onclick = stopRecording;
    }
  }
}

/* ============================================================
   TIMERS
   ============================================================ */
function startGlobalTimer(){
  if(state.globalTimerHandle) clearInterval(state.globalTimerHandle);
  state.globalTimerHandle = setInterval(()=>{
    state.globalTimeLeft--;
    const el = document.getElementById("globalTimerDisplay");
    if(el){
      el.textContent = fmtTime(state.globalTimeLeft);
      el.classList.toggle("low", state.globalTimeLeft < 300);
    }
    if(state.globalTimeLeft<=0){
      clearInterval(state.globalTimerHandle);
      autoSubmitAllAndEnd();
    }
  },1000);
}

function startQuestionTimer(qid){
  state.qTimerStart = Date.now();
  if(state.qTimerHandle) clearInterval(state.qTimerHandle);
  state.qTimerHandle = setInterval(()=>{
    const el = document.getElementById("qTimerDisplay");
    if(el){
      const base = (state.answers[qid] && state.answers[qid].timeSpent) || 0;
      const elapsed = base + (Date.now()-state.qTimerStart)/1000;
      el.textContent = fmtTime(elapsed);
    }
  },1000);
}

function pauseQuestionTimer(callback){
  if(state.qTimerHandle) clearInterval(state.qTimerHandle);
  const qid = state.currentQid;
  if(qid && state.qTimerStart){
    const elapsedSec = (Date.now()-state.qTimerStart)/1000;
    const a = state.answers[qid] || {text:"", timeSpent:0, submitted:false};
    a.timeSpent = (a.timeSpent||0) + elapsedSec;
    state.answers[qid] = a;
  }
  state.qTimerStart = null;
  if(callback) callback();
}

/* ============================================================
   QUESTION FLOW
   ============================================================ */
function openQuestion(qid){
  state.currentQid = qid;
  const existing = state.answers[qid];
  if(!existing) state.answers[qid] = {text:"", timeSpent:0, submitted:false};
  state.screen = "question";
  render();
  startQuestionTimer(qid);
}

function saveDraftAndGoToMap(){
  const qid = state.currentQid;
  const q = state.questions.find(x=>x.id===qid);
  if(q && q.type==="mcq"){
    const checked = document.querySelector('input[name="mcqOption"]:checked');
    if(checked) state.answers[qid].selectedOption = parseInt(checked.value,10);
  } else if(q && !q.video){
    const el = document.getElementById("answerText");
    if(el) state.answers[qid].text = el.value;
  }
  state.screen = "map";
  render();
}

function submitCurrentQuestion(){
  pauseQuestionTimer(async ()=>{
    const qid = state.currentQid;
    const q = state.questions.find(x=>x.id===qid);
    const a = state.answers[qid];

    if(q.type==="mcq"){
      const checked = document.querySelector('input[name="mcqOption"]:checked');
      if(checked) a.selectedOption = parseInt(checked.value,10);
      if(a.selectedOption===undefined || a.selectedOption===null){ showInlineWarning("Please select an option before submitting."); resumeAfterCancelledSubmit(qid); return; }
    } else if(q.video){
      if(!a.videoBlob){ showInlineWarning("Please record your response before submitting."); resumeAfterCancelledSubmit(qid); return; }
    } else {
      const el = document.getElementById("answerText");
      if(el) a.text = el.value;
      if(!a.text || !a.text.trim()){ showInlineWarning("Please enter a response before submitting."); resumeAfterCancelledSubmit(qid); return; }
    }

    a.submitted = true;

    let videoBase64 = null;
    if(q.video && a.videoBlob){
      videoBase64 = await blobToBase64(a.videoBlob);
    }

    sendToBackend({
      type:"question_submit",
      session:state.session,
      candidate:state.candidate,
      questionId: qid,
      section: q.section,
      answerText: a.text || null,
      selectedOption: (q.type==="mcq") ? a.selectedOption : null,
      selectedOptionText: (q.type==="mcq") ? q.options[a.selectedOption] : null,
      isCorrect: (q.type==="mcq") ? (a.selectedOption===q.correctIndex) : null,
      videoBase64: videoBase64,
      videoMime: q.video ? "video/webm" : null,
      timeSpentSec: Math.round(a.timeSpent),
      timestamp: new Date().toISOString()
    });

    // Submitting a question advances straight to the next unanswered question,
    // rather than dropping the candidate onto the review/map screen every time.
    // The review screen is reserved for: (a) an explicit "Review" click, or
    // (b) automatically, once every question in this session has been submitted.
    const next = state.questions.find(x=>!(state.answers[x.id] && state.answers[x.id].submitted));
    if(next){
      openQuestion(next.id);
    } else {
      state.screen = "map";
      render();
    }
  });
}

function resumeAfterCancelledSubmit(qid){
  // re-arm the question timer since we paused it before validation failed
  state.currentQid = qid;
  startQuestionTimer(qid);
}

function finishSession(){
  if(state.globalTimerHandle) clearInterval(state.globalTimerHandle);
  state.sessionActive = false;
  stopHeartbeat();
  state.doneReason = "completed";
  sendToBackend({
    type:"session_complete",
    session:state.session,
    candidate:state.candidate,
    timestamp:new Date().toISOString()
  });
  state.screen = "done";
  render();
}

function autoSubmitAllAndEnd(reason){
  reason = reason || "time_limit";
  if(state.globalTimerHandle) clearInterval(state.globalTimerHandle);
  state.sessionActive = false;
  stopHeartbeat();
  state.doneReason = reason;
  // lock in whatever is on screen for the current question, then force-submit every unsubmitted question with current draft state
  const qid = state.currentQid;
  if(qid && state.screen==="question"){
    const q = state.questions.find(x=>x.id===qid);
    if(q && q.type==="mcq"){
      const checked = document.querySelector('input[name="mcqOption"]:checked');
      if(checked) state.answers[qid].selectedOption = parseInt(checked.value,10);
    } else if(q && !q.video){
      const el = document.getElementById("answerText");
      if(el) state.answers[qid].text = el.value;
    }
  }
  state.questions.forEach(q=>{
    const a = state.answers[q.id] || {text:"", timeSpent:0, submitted:false};
    if(!a.submitted){
      a.submitted = true;
      state.answers[q.id] = a;
      sendToBackend({
        type:"question_submit_autotimeout",
        session:state.session,
        candidate:state.candidate,
        questionId:q.id,
        section:q.section,
        answerText:a.text||null,
        selectedOption: (q.type==="mcq") ? (a.selectedOption!==undefined ? a.selectedOption : null) : null,
        selectedOptionText: (q.type==="mcq" && a.selectedOption!==undefined) ? q.options[a.selectedOption] : null,
        isCorrect: (q.type==="mcq" && a.selectedOption!==undefined) ? (a.selectedOption===q.correctIndex) : null,
        videoBase64:null,
        timeSpentSec:Math.round(a.timeSpent||0),
        reason: reason,
        timestamp:new Date().toISOString()
      });
    }
  });
  sendToBackend({
    type:"session_complete_autotimeout",
    session:state.session, candidate:state.candidate,
    reason: reason,
    timestamp:new Date().toISOString()
  });
  state.screen = "done";
  render();
}

/* ============================================================
   VIDEO RECORDING
   ============================================================ */
async function startRecording(){
  const qid = state.currentQid;
  try{
    state.ignoreFocusUntil = Date.now() + 6000; // permission dialogs can blur the window
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    const previewEl = document.getElementById("preview");
    previewEl.srcObject = stream;

    state.recordedChunks = [];
    state.mediaRecorder = new MediaRecorder(stream, {mimeType:"video/webm"});
    state.mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) state.recordedChunks.push(e.data); };
    state.mediaRecorder.onstop = ()=>{
      const blob = new Blob(state.recordedChunks, {type:"video/webm"});
      state.answers[qid].videoBlob = blob;
      state.answers[qid].videoBlobUrl = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      render(); // re-render to show preview + re-bind
      startQuestionTimer(qid); // timer keeps running across re-render
    };
    state.mediaRecorder.start();
    state.recStartTime = Date.now();

    document.getElementById("recStatus").classList.add("active");
    document.getElementById("btnRecord").disabled = true;
    document.getElementById("btnStop").disabled = false;

    const tickHandle = setInterval(()=>{
      const secs = Math.round((Date.now()-state.recStartTime)/1000);
      const timerEl = document.getElementById("recTimer");
      if(timerEl) timerEl.textContent = secs;
      if(secs>=90 || state.mediaRecorder.state!=="recording"){
        clearInterval(tickHandle);
        if(state.mediaRecorder.state==="recording") state.mediaRecorder.stop();
      }
    },1000);
  }catch(err){
    showInlineWarning("Camera/microphone access is required for this question. Please allow access and try again.");
  }
}

function stopRecording(){
  if(state.mediaRecorder && state.mediaRecorder.state==="recording"){
    state.mediaRecorder.stop();
  }
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
